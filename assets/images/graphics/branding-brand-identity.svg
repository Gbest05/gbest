<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="brandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E18"/>
      <stop offset="100%" stop-color="#04060B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="purpleBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#brandBg)"/>
  
  <!-- Stationery & Identity Mockup Layout -->
  <!-- Top: Logo Presentation Card -->
  <rect x="50" y="50" width="500" height="240" rx="16" fill="#111827" stroke="#1F2937" stroke-width="1.5"/>
  <rect x="230" y="90" width="80" height="80" rx="20" fill="url(#purpleBrand)"/>
  <text x="270" y="142" fill="#FFFFFF" font-family="'Syne', sans-serif" font-size="34" font-weight="900" text-anchor="middle">GB</text>
  <text x="270" y="210" fill="#FFFFFF" font-family="'Syne', sans-serif" font-size="20" font-weight="800" text-anchor="middle">GBEST TECHNOLOGIES</text>
  <text x="270" y="235" fill="#06B6D4" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="2">BRAND IDENTITY GUIDELINES</text>

  <!-- Business Cards Isometric Layout -->
  <!-- Dark Card Front -->
  <g transform="translate(60, 320) rotate(-6)">
    <rect width="240" height="140" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.6))"/>
    <rect x="20" y="20" width="30" height="30" rx="8" fill="url(#purpleBrand)"/>
    <text x="35" y="40" fill="#FFFFFF" font-family="'Syne', sans-serif" font-size="12" font-weight="800" text-anchor="middle">G</text>
    <text x="60" y="38" fill="#FFFFFF" font-family="'Syne', sans-serif" font-size="13" font-weight="800">GBEST</text>
    <text x="20" y="85" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">Gbolahan Alade</text>
    <text x="20" y="100" fill="#06B6D4" font-family="-apple-system, sans-serif" font-size="9">Lead Designer &amp; Tech Architect</text>
    <text x="20" y="120" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="8">alade.gbolahan@gbest.tech</text>
  </g>

  <!-- Light Card Back -->
  <g transform="translate(300, 340) rotate(5)">
    <rect width="240" height="140" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.5))"/>
    <circle cx="120" cy="70" r="30" fill="url(#purpleBrand)"/>
    <text x="120" y="78" fill="#FFFFFF" font-family="'Syne', sans-serif" font-size="20" font-weight="800" text-anchor="middle">GB</text>
    <text x="120" y="120" fill="#0F172A" font-family="'Syne', sans-serif" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="2">WWW.GBEST.TECH</text>
  </g>

  <!-- Color Palette Chips -->
  <g transform="translate(50, 520)">
    <rect width="500" height="170" rx="14" fill="#111827" stroke="#1F2937" stroke-width="1.5"/>
    <text x="25" y="35" fill="#FFFFFF" font-family="'Syne', sans-serif" font-size="13" font-weight="700">BRAND COLOR SYSTEM</text>
    
    <rect x="25" y="55" width="80" height="60" rx="8" fill="#8B5CF6"/>
    <text x="65" y="132" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">#8B5CF6</text>

    <rect x="120" y="55" width="80" height="60" rx="8" fill="#06B6D4"/>
    <text x="160" y="132" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">#06B6D4</text>

    <rect x="215" y="55" width="80" height="60" rx="8" fill="#F59E0B"/>
    <text x="255" y="132" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">#F59E0B</text>

    <rect x="310" y="55" width="80" height="60" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="350" y="132" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">#111827</text>

    <rect x="405" y="55" width="70" height="60" rx="8" fill="#F8FAFC"/>
    <text x="440" y="132" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle">#F8FAFC</text>
  </g>
</svg>
