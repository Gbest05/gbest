<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="reportBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#reportBg)"/>

  <!-- Magazine / Report Cover Layout -->
  <!-- Header Bar -->
  <rect x="50" y="50" width="500" height="6" fill="url(#emeraldGrad)"/>
  
  <text x="50" y="90" fill="#94A3B8" font-family="'Syne', sans-serif" font-size="12" font-weight="700" letter-spacing="3">FINANCIAL &amp; IMPACT REPORT</text>
  <text x="550" y="90" fill="#10B981" font-family="'Syne', sans-serif" font-size="12" font-weight="800" text-anchor="end">ANNUAL 2026</text>

  <!-- Big Hero Title -->
  <text x="50" y="180" fill="#FFFFFF" font-family="'Syne', sans-serif" font-size="42" font-weight="900" line-height="1.1">SCALING</text>
  <text x="50" y="230" fill="url(#emeraldGrad)" font-family="'Syne', sans-serif" font-size="42" font-weight="900">INTELLIGENT</text>
  <text x="50" y="280" fill="#FFFFFF" font-family="'Syne', sans-serif" font-size="42" font-weight="900">SYSTEMS</text>

  <!-- Infographic Chart Cards on Cover -->
  <g transform="translate(50, 330)">
    <rect width="500" height="240" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    
    <!-- Bar 1 -->
    <rect x="50" y="140" width="60" height="60" rx="6" fill="#64748B"/>
    <text x="80" y="130" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">2023</text>
    <text x="80" y="175" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">$1.2M</text>

    <!-- Bar 2 -->
    <rect x="150" y="100" width="60" height="100" rx="6" fill="#06B6D4"/>
    <text x="180" y="90" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">2024</text>
    <text x="180" y="150" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">$2.8M</text>

    <!-- Bar 3 -->
    <rect x="250" y="60" width="60" height="140" rx="6" fill="#8B5CF6"/>
    <text x="280" y="50" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle">2025</text>
    <text x="280" y="130" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">$5.4M</text>

    <!-- Bar 4 (Projected) -->
    <rect x="350" y="20" width="60" height="180" rx="6" fill="url(#emeraldGrad)"/>
    <text x="380" y="10" fill="#10B981" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2026 (Est)</text>
    <text x="380" y="110" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle">$9.6M</text>
  </g>

  <!-- Editorial Note -->
  <g transform="translate(50, 610)">
    <text x="0" y="0" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Enterprise Digital Modernization &amp; Software Strategy</text>
    <text x="0" y="22" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Published by GBEST Research &amp; Advisory Wing • 48 Pages Executive Brief</text>
  </g>
</svg>
