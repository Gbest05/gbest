<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#03060C"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#logoBg)"/>

  <!-- Logo Grid & Construction Lines -->
  <g opacity="0.12" stroke="#8B5CF6" stroke-width="1">
    <circle cx="300" cy="280" r="160"/>
    <circle cx="300" cy="280" r="120"/>
    <circle cx="300" cy="280" r="80"/>
    <line x1="300" y1="50" x2="300" y2="500"/>
    <line x1="100" y1="280" x2="500" y2="280"/>
    <line x1="160" y1="140" x2="440" y2="420"/>
    <line x1="160" y1="420" x2="440" y2="140"/>
  </g>

  <!-- Central Modern Tech Monogram Icon -->
  <g transform="translate(180, 160)">
    <!-- Outer Hex Shield -->
    <polygon points="120,0 240,68 240,204 120,272 0,204 0,68" fill="url(#logoBg)" stroke="url(#logoGrad)" stroke-width="6"/>
    
    <!-- Stylized G and B Intersection -->
    <path d="M 70 80 L 160 80 L 160 120 L 110 120 L 110 160 L 160 160 L 160 200 L 70 200 Z" fill="url(#logoGrad)"/>
    <circle cx="170" cy="95" r="12" fill="#06B6D4"/>
  </g>

  <!-- Typography & Brand Presentation -->
  <g transform="translate(300, 520)">
    <text x="0" y="0" fill="#FFFFFF" font-family="'Syne', sans-serif" font-size="36" font-weight="900" text-anchor="middle" letter-spacing="4">GBEST</text>
    <text x="0" y="32" fill="#06B6D4" font-family="'Syne', sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="6">TECHNOLOGIES</text>
    <text x="0" y="70" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">Vector Geometry • Golden Ratio Construction • Modern Tech Identity</text>
  </g>

  <!-- Sub-versions showcase -->
  <g transform="translate(100, 630)">
    <rect x="0" y="0" width="180" height="60" rx="10" fill="#111827" stroke="#1F2937" stroke-width="1"/>
    <text x="90" y="35" fill="#FFFFFF" font-family="'Syne', sans-serif" font-size="14" font-weight="800" text-anchor="middle">GBEST Dark</text>

    <rect x="220" y="0" width="180" height="60" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="310" y="35" fill="#0F172A" font-family="'Syne', sans-serif" font-size="14" font-weight="800" text-anchor="middle">GBEST Light</text>
  </g>
</svg>
