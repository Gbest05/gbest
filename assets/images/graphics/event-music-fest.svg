<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="festBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0A2A"/>
      <stop offset="50%" stop-color="#0F051C"/>
      <stop offset="100%" stop-color="#06020C"/>
    </linearGradient>
    <linearGradient id="raveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#festBg)"/>

  <!-- Rave / Synthwave Visual Elements -->
  <!-- Sun / Soundwave Ring -->
  <circle cx="300" cy="260" r="130" fill="none" stroke="url(#raveGrad)" stroke-width="4"/>
  <circle cx="300" cy="260" r="100" fill="url(#festBg)"/>
  
  <!-- Sound Wave Bars -->
  <g transform="translate(180, 260)" fill="url(#raveGrad)">
    <rect x="0" y="-15" width="6" height="30" rx="3"/>
    <rect x="15" y="-30" width="6" height="60" rx="3"/>
    <rect x="30" y="-45" width="6" height="90" rx="3"/>
    <rect x="45" y="-60" width="6" height="120" rx="3"/>
    <rect x="60" y="-80" width="6" height="160" rx="3"/>
    <rect x="75" y="-60" width="6" height="120" rx="3"/>
    <rect x="90" y="-45" width="6" height="90" rx="3"/>
    <rect x="105" y="-30" width="6" height="60" rx="3"/>
    <rect x="120" y="-15" width="6" height="30" rx="3"/>
  </g>

  <!-- Typography -->
  <text x="300" y="80" fill="#EC4899" font-family="'Syne', sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="6">GBEST ENTERTAINMENT PRESENTS</text>

  <g transform="translate(300, 470)">
    <text x="0" y="0" fill="#FFFFFF" font-family="'Syne', sans-serif" font-size="44" font-weight="900" text-anchor="middle">SYNTHWAVE</text>
    <text x="0" y="45" fill="url(#raveGrad)" font-family="'Syne', sans-serif" font-size="44" font-weight="900" text-anchor="middle">NIGHTS 2026</text>
    <text x="0" y="85" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle">Live Electronic Sets • Holographic Visuals • Afro-Fusion Vibes</text>
  </g>

  <!-- Ticket Box -->
  <g transform="translate(75, 610)">
    <rect width="450" height="70" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="30" y="32" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">SATURDAY, DEC 12</text>
    <text x="30" y="52" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Landmark Beach Arena • 8:00 PM</text>

    <rect x="310" y="15" width="115" height="40" rx="10" fill="url(#raveGrad)"/>
    <text x="367" y="40" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" text-anchor="middle">GET PASS</text>
  </g>
</svg>
