<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="flyerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0C20"/>
      <stop offset="50%" stop-color="#1B1238"/>
      <stop offset="100%" stop-color="#080B14"/>
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E62"/>
      <stop offset="100%" stop-color="#FF9966"/>
    </linearGradient>
    <linearGradient id="purpleGlow2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="750" fill="url(#flyerGrad)"/>
  
  <!-- Glowing Graphic Shapes -->
  <circle cx="500" cy="180" r="140" fill="#8B5CF6" opacity="0.25"/>
  <circle cx="100" cy="550" r="160" fill="#06B6D4" opacity="0.18"/>

  <!-- Geometric Polygonal Art -->
  <polygon points="300,100 450,220 380,360 220,360 150,220" fill="none" stroke="url(#purpleGlow2)" stroke-width="3"/>
  <polygon points="300,140 400,230 350,320 250,320 200,230" fill="none" stroke="#FF5E62" stroke-width="2" opacity="0.7"/>

  <!-- Core Content -->
  <rect x="50" y="50" width="120" height="26" rx="13" fill="#8B5CF6" opacity="0.3"/>
  <text x="110" y="67" fill="#8B5CF6" font-family="'Syne', sans-serif" font-size="11" font-weight="700" text-anchor="middle">TECH INNOVATION</text>

  <text x="50" y="440" fill="#06B6D4" font-family="'Syne', sans-serif" font-size="14" font-weight="800" letter-spacing="3">GLOBAL TECH SUMMIT 2026</text>
  <text x="50" y="490" fill="#FFFFFF" font-family="'Syne', sans-serif" font-size="38" font-weight="800" line-height="1">SHAPING THE</text>
  <text x="50" y="535" fill="url(#neonOrange)" font-family="'Syne', sans-serif" font-size="38" font-weight="800">FUTURE OF AI</text>

  <text x="50" y="575" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="14">Keynote talks, developer workshops &amp; startup pitch battle.</text>

  <!-- Date & Venue Bar -->
  <rect x="50" y="615" width="500" height="70" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  
  <text x="80" y="645" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">🗓️ OCT 14-16, 2026</text>
  <text x="80" y="665" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Tech Convention Arena</text>

  <rect x="410" y="630" width="120" height="40" rx="8" fill="url(#purpleGlow2)"/>
  <text x="470" y="655" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">REGISTER</text>
</svg>
