<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1322"/>
      <stop offset="100%" stop-color="#060912"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad8)"/>

  <!-- Main Screen Window -->
  <rect x="80" y="55" width="640" height="390" rx="16" fill="#12192C" stroke="#222F4C" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="80" y="55" width="640" height="48" rx="16" fill="#18233C"/>
  <rect x="80" y="87" width="640" height="16" fill="#18233C"/>
  <circle cx="106" cy="79" r="5" fill="#EF4444"/>
  <circle cx="122" cy="79" r="5" fill="#F59E0B"/>
  <circle cx="138" cy="79" r="5" fill="#10B981"/>
  <text x="400" y="84" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">ai-text-detector.linguistics.ai/analyzer</text>

  <!-- Left: Text Analysis Box with Highlighting -->
  <rect x="105" y="125" width="350" height="295" rx="12" fill="#0A0E1A" stroke="#1E2B4A" stroke-width="1"/>
  <text x="125" y="152" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">SUBMITTED TEXT SEGMENTS</text>
  
  <!-- Highlighted text lines -->
  <g transform="translate(125, 170)">
    <!-- Line 1 with AI highlight -->
    <rect x="0" y="0" width="310" height="22" rx="4" fill="#EF4444" opacity="0.25"/>
    <text x="8" y="15" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11">In the modern era of rapid technological progress,</text>

    <!-- Line 2 with AI highlight -->
    <rect x="0" y="28" width="310" height="22" rx="4" fill="#EF4444" opacity="0.25"/>
    <text x="8" y="43" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11">it is crucial to acknowledge the multifaceted nature</text>

    <!-- Line 3 with AI highlight -->
    <rect x="0" y="56" width="310" height="22" rx="4" fill="#EF4444" opacity="0.25"/>
    <text x="8" y="71" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11">of artificial intelligence in transforming industries...</text>

    <!-- Line 4 (Human written) -->
    <rect x="0" y="84" width="310" height="22" rx="4" fill="#10B981" opacity="0.15"/>
    <text x="8" y="99" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11">Our field study showed only 12 out of 80 participants</text>

    <!-- Line 5 (Human written) -->
    <rect x="0" y="112" width="310" height="22" rx="4" fill="#10B981" opacity="0.15"/>
    <text x="8" y="127" fill="#E2E8F0" font-family="-apple-system, sans-serif" font-size="11">noticed the latency variation during peak hours.</text>
  </g>

  <rect x="125" y="360" width="310" height="40" rx="8" fill="#162038"/>
  <text x="140" y="384" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="11">Perplexity Score: 18.4 (Low Variance)</text>

  <!-- Right: Detector Probability Gauge -->
  <rect x="475" y="125" width="220" height="295" rx="12" fill="#162038" stroke="#253556" stroke-width="1"/>
  <text x="495" y="152" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">AI PROBABILITY</text>

  <circle cx="585" cy="225" r="55" fill="none" stroke="#222F4C" stroke-width="10"/>
  <circle cx="585" cy="225" r="55" fill="none" stroke="url(#amberGlow)" stroke-width="10" stroke-dasharray="345" stroke-dashoffset="35" stroke-linecap="round"/>
  <text x="585" y="232" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="24" font-weight="800" text-anchor="middle">91.4%</text>
  <text x="585" y="248" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">AI GENERATED</text>

  <!-- Metrics Breakdown -->
  <rect x="495" y="305" width="180" height="32" rx="6" fill="#0A0E1A"/>
  <text x="505" y="325" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">Burstiness Index</text>
  <text x="665" y="325" fill="#EF4444" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="end">Low (2.1)</text>

  <rect x="495" y="345" width="180" height="32" rx="6" fill="#0A0E1A"/>
  <text x="505" y="365" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">Confidence Level</text>
  <text x="665" y="365" fill="#10B981" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="end">High (98.6%)</text>
</svg>
