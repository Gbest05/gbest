<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#060A14"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad4)"/>

  <!-- Main Container -->
  <rect x="80" y="55" width="640" height="390" rx="16" fill="#111827" stroke="#1F2937" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="80" y="55" width="640" height="48" rx="16" fill="#1A2338"/>
  <rect x="80" y="87" width="640" height="16" fill="#1A2338"/>
  <circle cx="106" cy="79" r="5" fill="#EF4444"/>
  <circle cx="122" cy="79" r="5" fill="#F59E0B"/>
  <circle cx="138" cy="79" r="5" fill="#10B981"/>
  <text x="400" y="84" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">student-predict-ml.edu.ai/analytics</text>

  <!-- Left: Predictive Metric Card -->
  <rect x="105" y="125" width="230" height="295" rx="12" fill="#162035" stroke="#263554" stroke-width="1"/>
  <text x="125" y="152" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">STUDENT ML PREDICTOR</text>
  <text x="125" y="175" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Projected CGPA: 4.85</text>
  <text x="125" y="195" fill="#10B981" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">▲ Top 2% Class Distinction</text>

  <!-- Model Features Gauges -->
  <text x="125" y="235" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="11">Attendance Rate (96%)</text>
  <rect x="125" y="243" width="190" height="6" rx="3" fill="#0E1424"/>
  <rect x="125" y="243" width="182" height="6" rx="3" fill="#10B981"/>

  <text x="125" y="275" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="11">Continuous Assessment (92%)</text>
  <rect x="125" y="283" width="190" height="6" rx="3" fill="#0E1424"/>
  <rect x="125" y="283" width="174" height="6" rx="3" fill="#06B6D4"/>

  <text x="125" y="315" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="11">LMS Activity Score (88%)</text>
  <rect x="125" y="323" width="190" height="6" rx="3" fill="#0E1424"/>
  <rect x="125" y="323" width="167" height="6" rx="3" fill="#8B5CF6"/>

  <rect x="125" y="360" width="190" height="40" rx="8" fill="#1E2B4A"/>
  <text x="140" y="378" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">Model Accuracy</text>
  <text x="140" y="393" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">R² = 0.948 (Random Forest)</text>

  <!-- Right: ML Performance Trend Chart -->
  <rect x="355" y="125" width="340" height="295" rx="12" fill="#162035" stroke="#263554" stroke-width="1"/>
  <text x="375" y="152" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Academic Trajectory Curve</text>
  <text x="375" y="170" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Predicted semester-by-semester GPA trends</text>

  <!-- Chart Area -->
  <g transform="translate(375, 200)">
    <line x1="0" y1="160" x2="300" y2="160" stroke="#2D3B5F" stroke-width="1"/>
    <line x1="0" y1="110" x2="300" y2="110" stroke="#2D3B5F" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="0" y1="60" x2="300" y2="60" stroke="#2D3B5F" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="0" y1="10" x2="300" y2="10" stroke="#2D3B5F" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Chart Path -->
    <path d="M 10 120 Q 70 90, 130 50 T 220 30 T 290 15 L 290 160 L 10 160 Z" fill="url(#chartGrad)"/>
    <path d="M 10 120 Q 70 90, 130 50 T 220 30 T 290 15" fill="none" stroke="#8B5CF6" stroke-width="3"/>

    <circle cx="10" cy="120" r="5" fill="#06B6D4"/>
    <circle cx="130" cy="50" r="5" fill="#06B6D4"/>
    <circle cx="220" cy="30" r="5" fill="#06B6D4"/>
    <circle cx="290" cy="15" r="6" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>

    <text x="10" y="180" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">Yr 1</text>
    <text x="130" y="180" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">Yr 2</text>
    <text x="220" y="180" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">Yr 3</text>
    <text x="280" y="180" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">Yr 4 (Pred)</text>
  </g>
</svg>
