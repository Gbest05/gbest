<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#04060C"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad3)"/>

  <!-- Neural Mesh Background -->
  <g opacity="0.18" stroke="#8B5CF6" stroke-width="1">
    <circle cx="200" cy="100" r="4" fill="#8B5CF6"/>
    <circle cx="350" cy="80" r="4" fill="#06B6D4"/>
    <circle cx="500" cy="120" r="4" fill="#8B5CF6"/>
    <circle cx="650" cy="90" r="4" fill="#EC4899"/>
    <line x1="200" y1="100" x2="350" y2="80"/>
    <line x1="350" y1="80" x2="500" y2="120"/>
    <line x1="500" y1="120" x2="650" y2="90"/>
  </g>

  <!-- Chatbot Window Container -->
  <rect x="130" y="45" width="540" height="410" rx="18" fill="#111728" stroke="#253250" stroke-width="2"/>
  
  <!-- Header -->
  <rect x="130" y="45" width="540" height="58" rx="18" fill="#18223B"/>
  <rect x="130" y="85" width="540" height="18" fill="#18223B"/>
  <circle cx="160" cy="74" r="16" fill="url(#purpleGlow)"/>
  <text x="160" y="79" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle">AI</text>
  <text x="190" y="70" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Departmental Intelligence Assistant</text>
  <text x="190" y="87" fill="#10B981" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">● Online &amp; Ready • NLP Pipeline Active</text>

  <!-- Chat Bubble 1 (Bot Greeting) -->
  <rect x="160" y="125" width="360" height="55" rx="12" fill="#1E2A48"/>
  <text x="175" y="146" fill="#F8FAFC" font-family="-apple-system, sans-serif" font-size="12">Hello! I am your Department AI Assistant.</text>
  <text x="175" y="165" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">How can I assist with course registration, timetable or faculty inquiries today?</text>

  <!-- Chat Bubble 2 (User Question) -->
  <rect x="310" y="195" width="330" height="42" rx="12" fill="#8B5CF6"/>
  <text x="325" y="221" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="500">When is the submission deadline for Final Year Projects?</text>

  <!-- Chat Bubble 3 (Bot Answer with Rich Card) -->
  <rect x="160" y="250" width="420" height="120" rx="12" fill="#1E2A48" stroke="#8B5CF6" stroke-width="1"/>
  <text x="175" y="272" fill="#06B6D4" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">ACADEMIC CALENDAR MATCH (CONFIDENCE 99.2%)</text>
  <text x="175" y="293" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12">The deadline for Departmental Project Bound Submissions is:</text>
  <text x="175" y="315" fill="#F59E0B" font-family="-apple-system, sans-serif" font-size="13" font-weight="800">📅 Friday, October 24th at 4:00 PM</text>
  <text x="175" y="338" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">Submissions must be delivered to Room 302, Computer Science Wing.</text>
  <rect x="175" y="348" width="130" height="16" rx="4" fill="#0E1424"/>
  <text x="240" y="360" fill="#8B5CF6" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">View Guidelines PDF</text>

  <!-- Input Bar -->
  <rect x="155" y="390" width="490" height="46" rx="10" fill="#0E1424" stroke="#2D3B5F" stroke-width="1"/>
  <text x="175" y="418" fill="#64748B" font-family="-apple-system, sans-serif" font-size="12">Type your department question here...</text>
  <circle cx="620" cy="413" r="14" fill="#8B5CF6"/>
  <polygon points="616,408 626,413 616,418" fill="#FFFFFF"/>
</svg>
