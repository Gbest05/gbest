<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1424"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.15" stroke="#8B5CF6" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Glow Circles -->
  <circle cx="150" cy="120" r="90" fill="#8B5CF6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="650" cy="380" r="110" fill="#06B6D4" opacity="0.15" filter="url(#glow)"/>

  <!-- Dashboard Container Card -->
  <rect x="80" y="60" width="640" height="380" rx="16" fill="#131B30" stroke="#1F2937" stroke-width="2"/>
  
  <!-- Window Header -->
  <rect x="80" y="60" width="640" height="42" rx="16" fill="#1A233D"/>
  <rect x="80" y="86" width="640" height="16" fill="#1A233D"/>
  <circle cx="106" cy="81" r="5" fill="#EF4444"/>
  <circle cx="122" cy="81" r="5" fill="#F59E0B"/>
  <circle cx="138" cy="81" r="5" fill="#10B981"/>
  <text x="400" y="86" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">siwes-allocation-portal.internal/dashboard</text>

  <!-- Sidebar -->
  <rect x="80" y="102" width="140" height="338" fill="#0E1424"/>
  <rect x="100" y="125" width="100" height="12" rx="4" fill="#8B5CF6" opacity="0.8"/>
  <rect x="100" y="155" width="80" height="8" rx="3" fill="#64748B"/>
  <rect x="100" y="175" width="90" height="8" rx="3" fill="#64748B"/>
  <rect x="100" y="195" width="70" height="8" rx="3" fill="#64748B"/>
  <rect x="100" y="215" width="85" height="8" rx="3" fill="#64748B"/>

  <!-- Main Content Area -->
  <text x="245" y="145" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">SIWES Placement &amp; Student Allocation Portal</text>
  <text x="245" y="165" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11">Automated student industrial training management &amp; supervisor matching</text>

  <!-- Metric Cards -->
  <rect x="245" y="185" width="140" height="70" rx="10" fill="#1A233D" stroke="#2D3B5F" stroke-width="1"/>
  <text x="260" y="210" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">Total Students</text>
  <text x="260" y="240" fill="#8B5CF6" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">1,420</text>

  <rect x="400" y="185" width="140" height="70" rx="10" fill="#1A233D" stroke="#2D3B5F" stroke-width="1"/>
  <text x="415" y="210" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">Placed &amp; Verified</text>
  <text x="415" y="240" fill="#06B6D4" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">98.4%</text>

  <rect x="555" y="185" width="140" height="70" rx="10" fill="#1A233D" stroke="#2D3B5F" stroke-width="1"/>
  <text x="570" y="210" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="10">Partner Firms</text>
  <text x="570" y="240" fill="#10B981" font-family="-apple-system, sans-serif" font-size="22" font-weight="800">260+</text>

  <!-- Allocation Table Representation -->
  <rect x="245" y="275" width="450" height="140" rx="10" fill="#1A233D" stroke="#2D3B5F" stroke-width="1"/>
  <rect x="245" y="275" width="450" height="30" rx="10" fill="#243054"/>
  <text x="265" y="295" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">STUDENT NAME</text>
  <text x="410" y="295" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">INDUSTRY PLACEMENT</text>
  <text x="610" y="295" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600">STATUS</text>

  <text x="265" y="330" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11">Adeyemi O. Samuel</text>
  <text x="410" y="330" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="11">Chevron IT Operations</text>
  <rect x="605" y="318" width="70" height="18" rx="9" fill="#10B981" opacity="0.2"/>
  <text x="640" y="331" fill="#10B981" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">ALLOCATED</text>

  <line x1="245" y1="348" x2="695" y2="348" stroke="#2D3B5F" stroke-width="1"/>

  <text x="265" y="375" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11">Fatima B. Mohammed</text>
  <text x="410" y="375" fill="#CBD5E1" font-family="-apple-system, sans-serif" font-size="11">First Bank FinTech Labs</text>
  <rect x="605" y="363" width="70" height="18" rx="9" fill="#06B6D4" opacity="0.2"/>
  <text x="640" y="376" fill="#06B6D4" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">VERIFIED</text>
</svg>
