  <text x="470" y="261" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">David Babatunde</text>
  <text x="470" y="276" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="9">CSC-19-4829 • 08:43:02 AM</text>
