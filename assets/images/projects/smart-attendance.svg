  <circle cx="148" cy="78" r="5" fill="#10B981"/>
  <text x="400" y="83" fill="#94A3B8" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">vision-attendance.terminal.ai/live-feed</text>

  <!-- Left: Live Computer Vision Camera Feed -->
  <rect x="115" y="120" width="280" height="300" rx="12" fill="#070C14" stroke="#06B6D4" stroke-width="1.5"/>
  
  <!-- Face Recognition Bounding Box -->
  <g transform="translate(190, 180)">
    <!-- Face Silhouette Outline -->
    <ellipse cx="65" cy="70" rx="45" ry="55" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,4"/>
