    <path d="M 110 20 L 110 5 L 95 5" fill="none" stroke="#10B981" stroke-width="3"/>
    <path d="M 5 120 L 5 135 L 20 135" fill="none" stroke="#10B981" stroke-width="3"/>
    <path d="M 110 120 L 110 135 L 95 135" fill="none" stroke="#10B981" stroke-width="3"/>

    <!-- Match Tag -->
    <rect x="15" y="145" width="100" height="20" rx="4" fill="#10B981"/>
    <text x="65" y="159" fill="#080F18" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">MATCH: 99.8%</text>
  </g>

