<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F18"/>
      <stop offset="100%" stop-color="#04080D"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad7)"/>

  <!-- Main Screen -->
  <rect x="90" y="55" width="620" height="390" rx="16" fill="#0E1624" stroke="#1F2E45" stroke-width="2"/>
  
