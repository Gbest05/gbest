<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E34"/>
      <stop offset="50%" stop-color="#0E1626"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="neonRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D5524"/>
      <stop offset="100%" stop-color="#5C3818"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="600" fill="url(#avatarBgGrad)"/>

  <!-- Halo Glow Behind Head -->
  <circle cx="250" cy="240" r="160" fill="#8B5CF6" opacity="0.18"/>
  <circle cx="250" cy="240" r="130" fill="#06B6D4" opacity="0.15"/>

  <!-- Tech Geometric Circuit Lines -->
  <g opacity="0.25" stroke="#06B6D4" stroke-width="1.5" fill="none">
    <path d="M 50 150 L 150 150 L 200 200"/>
    <circle cx="50" cy="150" r="4" fill="#06B6D4"/>
    <path d="M 450 180 L 350 180 L 300 230"/>
    <circle cx="450" cy="180" r="4" fill="#8B5CF6"/>
    <path d="M 100 480 L 160 420 L 200 420"/>
    <circle cx="100" cy="480" r="4" fill="#F59E0B"/>
  </g>

  <!-- Body / Torso -->
  <g transform="translate(0, 20)">
    <!-- Jacket / Shoulders -->
    <path d="M 120 540 C 130 420, 180 390, 250 390 C 320 390, 370 420, 380 540 Z" fill="url(#jacketGrad)"/>
    
    <!-- T-Shirt V-Neck -->
    <path d="M 210 390 L 250 460 L 290 390 Z" fill="url(#shirtGrad)"/>
    <polygon points="230,390 250,440 270,390" fill="#38BDF8"/>

    <!-- Neck -->
    <rect x="220" y="320" width="60" height="85" rx="10" fill="url(#skinTone)"/>

    <!-- Head -->
    <ellipse cx="250" cy="230" rx="72" ry="92" fill="url(#skinTone)"/>

    <!-- Modern Stylish Hair -->
    <path d="M 175 220 C 175 130, 325 130, 325 220 C 325 180, 310 140, 250 140 C 190 140, 175 180, 175 220 Z" fill="#0A0706"/>
    <!-- Fade texture on side -->
    <path d="M 175 220 Q 185 160, 250 155 Q 315 160, 325 220 Q 320 185, 250 180 Q 180 185, 175 220 Z" fill="#1C1412"/>

    <!-- Ears -->
    <ellipse cx="176" cy="235" rx="10" ry="18" fill="#6E4018"/>
    <ellipse cx="324" cy="235" rx="10" ry="18" fill="#6E4018"/>

    <!-- Eyes & Brows -->
    <!-- Brows -->
    <path d="M 205 195 Q 225 190, 235 196" fill="none" stroke="#120A05" stroke-width="4" stroke-linecap="round"/>
    <path d="M 295 195 Q 275 190, 265 196" fill="none" stroke="#120A05" stroke-width="4" stroke-linecap="round"/>

    <!-- Eyes -->
    <ellipse cx="220" cy="210" rx="8" ry="5" fill="#FFFFFF"/>
    <circle cx="221" cy="210" r="4" fill="#24140B"/>
    <circle cx="222" cy="209" r="1.5" fill="#FFFFFF"/>

    <ellipse cx="280" cy="210" rx="8" ry="5" fill="#FFFFFF"/>
    <circle cx="279" cy="210" r="4" fill="#24140B"/>
    <circle cx="280" cy="209" r="1.5" fill="#FFFFFF"/>

    <!-- Stylish Modern Designer Glasses -->
    <rect x="200" y="195" width="40" height="30" rx="6" fill="none" stroke="#06B6D4" stroke-width="3"/>
    <rect x="260" y="195" width="40" height="30" rx="6" fill="none" stroke="#06B6D4" stroke-width="3"/>
    <line x1="240" y1="205" x2="260" y2="205" stroke="#06B6D4" stroke-width="3"/>
    <line x1="178" y1="205" x2="200" y2="205" stroke="#06B6D4" stroke-width="3"/>
    <line x1="300" y1="205" x2="322" y2="205" stroke="#06B6D4" stroke-width="3"/>

    <!-- Nose -->
    <path d="M 250 215 L 246 242 L 254 242" fill="none" stroke="#4D2A10" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Confident Smile -->
    <path d="M 230 268 Q 250 282, 270 268" fill="none" stroke="#381D09" stroke-width="3" stroke-linecap="round"/>
    <path d="M 234 269 Q 250 278, 266 269" fill="#FFFFFF" opacity="0.9"/>

    <!-- Clean Beard Trim -->
    <path d="M 195 240 Q 250 325, 305 240 Q 295 305, 250 310 Q 205 305, 195 240 Z" fill="#140C08" opacity="0.85"/>
  </g>
</svg>
